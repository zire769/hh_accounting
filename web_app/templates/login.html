<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f5f6f8; color: #111827; }
    form { width: min(360px, calc(100vw - 32px)); background: white; border: 1px solid #d9dde5; border-radius: 8px; padding: 22px; }
    h1 { margin: 0 0 14px; font-size: 22px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #5b6472; }
    input { width: 100%; height: 38px; border: 1px solid #d9dde5; border-radius: 6px; padding: 0 10px; box-sizing: border-box; }
    button { width: 100%; height: 38px; margin-top: 12px; border: 0; border-radius: 6px; background: #0f766e; color: white; font: inherit; cursor: pointer; }
    .flash { color: #b91c1c; margin-bottom: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <form method="post">
    <h1>Review Portal</h1>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
