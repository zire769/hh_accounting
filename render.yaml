services:
  - type: web
    name: hue-house-amazon-review
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT web_app.app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: REVIEW_APP_PASSWORD
        sync: false
      - key: REVIEW_APP_SECRET
        generateValue: true
      - key: REVIEW_DB_PATH
        value: /var/data/review_app.sqlite3
    disk:
      name: review-data
      mountPath: /var/data
      sizeGB: 1
